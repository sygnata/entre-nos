name: Release Promotion
on:
  create:
  pull_request_target:
    types: [closed]
permissions:
  contents: read
  pull-requests: write
jobs:
  open-develop-pull-request:
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Open promotion pull request
        uses: actions/github-script@v7
        env:
          GOVERNANCE_PR_TOKEN: ${{ secrets.GOVERNANCE_PR_TOKEN }}
        with:
          github-token: ${{ secrets.GOVERNANCE_PR_TOKEN }}
          script: |
            if (!process.env.GOVERNANCE_PR_TOKEN) {
              core.setFailed('Configure the GOVERNANCE_PR_TOKEN repository secret before using release automation.');
              return;
            }
            const release = context.payload.ref;
            if (!/^release\/v[0-9]+\.[0-9]+\.[0-9]+$/.test(release)) {
              core.setFailed(`Invalid release branch name: ${release}`);
              return;
            }

            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              head: `${owner}:develop`,
              base: release,
              per_page: 100,
            });
            if (existing.length) {
              core.info(`Promotion PR already exists: ${existing[0].html_url}`);
              return;
            }

            try {
              const pr = await github.rest.pulls.create({
                owner,
                repo,
                head: 'develop',
                base: release,
                title: `release: ${release.slice('release/'.length)}`,
                body: 'Automated promotion from `develop` to the new release branch.',
              });
              core.notice(`Created promotion PR: ${pr.data.html_url}`);
            } catch (error) {
              if (error.status === 422) {
                core.warning('No promotion PR was created. There may be no commits to compare between develop and the release branch.');
                return;
              }
              throw error;
            }

  open-production-pull-request:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop' && startsWith(github.event.pull_request.base.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Open production pull request
        uses: actions/github-script@v7
        env:
          GOVERNANCE_PR_TOKEN: ${{ secrets.GOVERNANCE_PR_TOKEN }}
        with:
          github-token: ${{ secrets.GOVERNANCE_PR_TOKEN }}
          script: |
            if (!process.env.GOVERNANCE_PR_TOKEN) {
              core.setFailed('Configure the GOVERNANCE_PR_TOKEN repository secret before using release automation.');
              return;
            }
            const release = context.payload.pull_request.base.ref;
            const production = 'master';
            if (!/^release\/v[0-9]+\.[0-9]+\.[0-9]+$/.test(release)) {
              core.setFailed(`Invalid release branch name: ${release}`);
              return;
            }

            const { owner, repo } = context.repo;
            await github.rest.repos.getBranch({ owner, repo, branch: production });
            const existing = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              head: `${owner}:${release}`,
              base: production,
              per_page: 100,
            });
            if (existing.length) {
              core.info(`Production PR already exists: ${existing[0].html_url}`);
              return;
            }

            try {
              const pr = await github.rest.pulls.create({
                owner,
                repo,
                head: release,
                base: production,
                title: `release: ${release.slice('release/'.length)}`,
                body: `Automated promotion from \`${release}\` to \`${production}\`.`,
              });
              core.notice(`Created production PR: ${pr.data.html_url}`);
            } catch (error) {
              if (error.status === 422) {
                core.warning('No production PR was created. There may be no commits to compare between the release branch and production.');
                return;
              }
              throw error;
            }
